<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Codex 本地用量</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local Codex Usage</p>
          <h1>Codex 本地用量</h1>
        </div>
        <div class="status">
          <span id="source">读取中</span>
          <button id="refresh" type="button" aria-label="刷新数据" title="刷新数据">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.34-5.66" />
              <path d="M20 4v6h-6" />
            </svg>
          </button>
        </div>
      </header>

      <section class="metric-grid" aria-label="核心指标">
        <article class="metric metric-primary">
          <span>总 Token</span>
          <strong id="totalTokens">-</strong>
          <small id="threadCount">-</small>
        </article>
        <article class="metric">
          <span>近 5 小时剩余</span>
          <strong id="fiveHourTokens">-</strong>
          <small id="fiveHourThreads">-</small>
        </article>
        <article class="metric">
          <span>今日</span>
          <strong id="todayTokens">-</strong>
          <small id="todayThreads">-</small>
        </article>
        <article class="metric">
          <span>本周剩余</span>
          <strong id="weekTokens">-</strong>
          <small id="weekThreads">-</small>
        </article>
        <article class="metric">
          <span>本月</span>
          <strong id="monthTokens">-</strong>
          <small id="monthThreads">-</small>
        </article>
      </section>

      <section class="panel quota-panel" aria-label="官方额度">
        <div class="section-head">
          <h2>官方额度</h2>
          <p id="quotaSource">读取中</p>
        </div>
        <div id="quotaDetails" class="quota-details"></div>
      </section>

      <section class="panel trend-panel">
        <div class="section-head">
          <div>
            <h2>近 30 天趋势</h2>
            <p id="updatedAt">-</p>
          </div>
          <div class="legend">
            <span><i></i>Token</span>
          </div>
        </div>
        <div id="chart" class="chart" aria-label="近 30 天 Token 用量柱状图"></div>
      </section>

      <section class="two-column">
        <div class="panel">
          <div class="section-head">
            <h2>项目分布</h2>
          </div>
          <div id="projects" class="rank-list"></div>
        </div>

        <div class="panel">
          <div class="section-head">
            <h2>模型分布</h2>
          </div>
          <div id="models" class="rank-list"></div>
        </div>
      </section>

      <section class="panel">
        <div class="section-head">
          <h2>最近会话</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>会话</th>
                <th>项目</th>
                <th>模型</th>
                <th>Token</th>
                <th>更新时间</th>
              </tr>
            </thead>
            <tbody id="recent"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
